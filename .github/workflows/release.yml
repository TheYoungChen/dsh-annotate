name: Release

# 推送形如 v0.3.0 的标签时，自动创建/更新对应的 GitHub Release，
# 正文取自 CHANGELOG.md 里 `## 0.3.0` 那一节。
#
# 为什么放在 Actions 里：创建 Release 需要凭据，而本地不应该存 token，
# 也不该要求每个维护者都装 gh CLI。凭据由 GitHub 自己提供（内置的 GITHUB_TOKEN），
# 本地只需要 `git push origin v0.3.0`，Release 页面就带着完整的更新日志出现。
#
# 为什么正文取自 CHANGELOG.md 而不是另写一份：
# 同一段改动写两遍，早晚会分叉，而分叉的那一份是别人正在读的那一份。
# 所以只有一份：CHANGELOG.md 的当前版本小节就是 Release 正文，两边天然一致。
# 代价是这一节要写给外面的人看 —— 不写"我在写注释时……"这类只有维护者关心的过程，
# 也不写内部测试细节。那些属于提交信息，不属于更新日志。
#
# 找不到对应小节就让这一步失败，而不是发一个空正文的 Release：
# 空正文比没有更糟，它会看起来像"这一版没有改动"。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take this version's section out of the changelog
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 从 `## <version>` 那一行开始，到下一个 `## ` 之前。
          awk -v want="## $version" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section for tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.notes.outputs.version }}"
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release edit "v$version" --title "v$version" --notes-file notes.md
          else
            gh release create "v$version" --title "v$version" --notes-file notes.md
          fi
