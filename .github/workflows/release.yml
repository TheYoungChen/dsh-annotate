name: Release

# 推送一个形如 v0.3.0 的标签时，自动建/更新对应的 GitHub Release，
# 正文取自 docs/releases/v0.3.0.md。
#
# 这样做的理由：本地没有 gh CLI、也不该把 token 放在机器上，而 Release 需要凭据。
# 放到 Actions 里跑，凭据由 GitHub 自己提供（内置的 GITHUB_TOKEN），本地只要
# `git push origin v0.3.0`，Release 页面就自动带着完整更新日志出现。
#
# 为什么正文单独一份文件、而不是从 CHANGELOG.md 切一段：
# CHANGELOG 是写给改这个插件的人看的（含"测试工具""变异锚点"这类内部细节），
# Release 是写给用它的人看的。两者的取舍不同，硬让一份兼任会两边都别扭。
# 对应地，`node scripts/check-release.mjs` 会断言两者都覆盖到了当前版本号 ——
# 少写其中一份不会静静地过去。
#
# 找不到正文文件就让这一步失败，而不是发一个空正文的 Release：
# 空正文比没有更糟，它会看起来像"这一版没有改动"。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find this version's release notes
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          file="docs/releases/v$version.md"
          if [ ! -f "$file" ]; then
            echo "::error::$file does not exist — write the release notes before tagging"
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "--- $file ---"
          cat "$file"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.notes.outputs.version }}"
          file="${{ steps.notes.outputs.file }}"
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release edit "v$version" --title "v$version" --notes-file "$file"
          else
            gh release create "v$version" --title "v$version" --notes-file "$file"
          fi

