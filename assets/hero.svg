<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="pagebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f2f3f7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="680" fill="#0f1115"/>

  <!-- window chrome -->
  <rect x="24" y="24" width="1152" height="632" rx="12" fill="#1a1d24"/>
  <rect x="24" y="24" width="1152" height="34" rx="12" fill="#22262f"/>
  <rect x="24" y="46" width="1152" height="12" fill="#22262f"/>
  <circle cx="48" cy="41" r="5" fill="#ff5f57"/>
  <circle cx="66" cy="41" r="5" fill="#febc2e"/>
  <circle cx="84" cy="41" r="5" fill="#28c840"/>
  <text x="600" y="46" fill="#8b93a7" font-size="12" text-anchor="middle">DeepSeek Harness — http://127.0.0.1:3000</text>

  <!-- ============ conversation panel (left) ============ -->
  <rect x="40" y="72" width="700" height="568" rx="8" fill="#15181e"/>

  <text x="60" y="102" fill="#6f7789" font-size="11" letter-spacing="1">CONVERSATION</text>

  <!-- user bubble -->
  <rect x="60" y="118" width="420" height="52" rx="8" fill="#232833"/>
  <text x="76" y="140" fill="#c8cddb" font-size="12.5">这个页面的充值模块，汇率显示太小了</text>
  <text x="76" y="158" fill="#c8cddb" font-size="12.5">帮我调一下，还有邀请码那块也看下</text>

  <!-- assistant reply -->
  <rect x="60" y="186" width="600" height="96" rx="8" fill="#1b1f27"/>
  <text x="76" y="208" fill="#7c869c" font-size="11" letter-spacing="0.5">ASSISTANT</text>
  <text x="76" y="230" fill="#c8cddb" font-size="12.5">我看到你标注了两个元素，我来调整：</text>
  <text x="76" y="250" fill="#9aa3b6" font-size="12">· .g-recharge — 汇率字号 16 → 20px</text>
  <text x="76" y="268" fill="#9aa3b6" font-size="12">· .code-row — 复制按钮增加 hover 反馈</text>

  <!-- annotation block marker (collapsed one-liner) -->
  <rect x="60" y="296" width="600" height="30" rx="6" fill="#1f2430" stroke="#2c3344"/>
  <circle cx="78" cy="311" r="4" fill="#f0a05a"/>
  <text x="92" y="315" fill="#8b93a7" font-size="11.5">界面标注 · 2 条  ▸</text>

  <!-- composer -->
  <rect x="60" y="540" width="660" height="80" rx="8" fill="#1b1f27" stroke="#2c3344"/>
  <text x="76" y="564" fill="#6f7789" font-size="11.5">我想改的地方：</text>
  <rect x="76" y="576" width="200" height="6" rx="3" fill="#2c3344"/>
  <rect x="560" y="580" width="140" height="26" rx="6" fill="#f0a05a"/>
  <text x="630" y="597" fill="#fff" font-size="11.5" text-anchor="middle" font-weight="600">加入输入框</text>

  <!-- ============ sidebar (right) ============ -->
  <rect x="752" y="72" width="408" height="568" rx="8" fill="#15181e"/>

  <!-- panel toolbar -->
  <text x="770" y="98" fill="#6f7789" font-size="11" letter-spacing="1">标注 · SIDEBAR</text>
  <rect x="770" y="110" width="74" height="28" rx="7" fill="#f0a05a"/>
  <text x="807" y="128" fill="#fff" font-size="12" text-anchor="middle" font-weight="600">标记</text>
  <rect x="852" y="110" width="80" height="28" rx="7" fill="none" stroke="#39414f"/>
  <text x="892" y="128" fill="#9aa3b6" font-size="12" text-anchor="middle">重新加载</text>
  <rect x="1000" y="110" width="146" height="28" rx="7" fill="none" stroke="#39414f"/>
  <circle cx="1020" cy="124" r="7" fill="#f0a05a"/>
  <text x="1032" y="128" fill="#c8cddb" font-size="11.5">2 已标注</text>

  <!-- ============ preview frame ============ -->
  <rect x="770" y="150" width="376" height="474" rx="8" fill="url(#pagebg)"/>

  <!-- fake page: header -->
  <rect x="770" y="150" width="376" height="36" rx="8" fill="#ffffff"/>
  <rect x="770" y="178" width="376" height="8" fill="#ffffff"/>
  <circle cx="792" cy="168" r="7" fill="#e8eaf0"/>
  <text x="812" y="172" fill="#3a4152" font-size="11" font-weight="600">Wallet Console</text>
  <rect x="1050" y="160" width="80" height="16" rx="8" fill="#eef0f5"/>

  <!-- recharge card (element 1) -->
  <rect x="786" y="202" width="220" height="96" rx="10" fill="#ffffff" filter="url(#soft)"/>
  <text x="802" y="224" fill="#8b93a7" font-size="10.5">充值</text>
  <text x="802" y="248" fill="#22262f" font-size="20" font-weight="700">Recharge</text>
  <rect x="802" y="260" width="66" height="22" rx="6" fill="#f0a05a"/>
  <text x="835" y="275" fill="#fff" font-size="10.5" text-anchor="middle" font-weight="600">立即兑换</text>

  <!-- highlight ring on recharge card -->
  <rect x="782" y="198" width="228" height="104" rx="12" fill="rgba(240,160,90,0.22)" stroke="#f0a05a" stroke-width="2.5"/>
  <rect x="778" y="194" width="6" height="6" rx="1" fill="#f0a05a" stroke="#fff"/>
  <rect x="1008" y="194" width="6" height="6" rx="1" fill="#f0a05a" stroke="#fff"/>
  <rect x="778" y="300" width="6" height="6" rx="1" fill="#f0a05a" stroke="#fff"/>
  <rect x="1008" y="300" width="6" height="6" rx="1" fill="#f0a05a" stroke="#fff"/>
  <!-- selector readout -->
  <rect x="782" y="176" width="86" height="18" rx="4" fill="rgba(17,17,17,0.92)"/>
  <text x="789" y="189" fill="#f5f5f5" font-size="10" font-family="ui-monospace,Menlo,monospace">.g-recharge</text>
  <!-- pin -->
  <circle cx="1010" cy="198" r="11" fill="#f0a05a" stroke="#fff" stroke-width="2"/>
  <text x="1010" y="202" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">1</text>

  <!-- invite code row (element 2) -->
  <rect x="786" y="322" width="330" height="60" rx="10" fill="#ffffff" filter="url(#soft)"/>
  <text x="802" y="346" fill="#8b93a7" font-size="10.5">我的邀请码</text>
  <text x="802" y="366" fill="#22262f" font-size="13" font-weight="600" font-family="ui-monospace,Menlo,monospace">K7Q2-XR9M</text>
  <rect x="980" y="340" width="120" height="26" rx="7" fill="#eef0f5"/>
  <text x="1040" y="357" fill="#3a4152" font-size="11" text-anchor="middle">复制邀请码</text>

  <!-- highlight ring on code row -->
  <rect x="782" y="318" width="338" height="68" rx="12" fill="rgba(240,160,90,0.22)" stroke="#f0a05a" stroke-width="2.5"/>
  <circle cx="1114" cy="318" r="11" fill="#f0a05a" stroke="#fff" stroke-width="2"/>
  <text x="1114" y="322" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">2</text>

  <!-- faint page skeleton below -->
  <rect x="786" y="406" width="240" height="12" rx="6" fill="#e4e7ee"/>
  <rect x="786" y="428" width="320" height="12" rx="6" fill="#e9ecf2"/>
  <rect x="786" y="450" width="180" height="12" rx="6" fill="#eceff4"/>
  <rect x="786" y="484" width="150" height="70" rx="10" fill="#eef0f5"/>
  <rect x="952" y="484" width="150" height="70" rx="10" fill="#eef0f5"/>

  <!-- ============ annotation list overlay (expanded) ============ -->
  <rect x="786" y="466" width="344" height="142" rx="10" fill="#ffffff" stroke="#e2e5ec" filter="url(#soft)"/>
  <text x="802" y="488" fill="#6f7789" font-size="10.5" letter-spacing="0.5">已标注 · 2</text>

  <rect x="798" y="498" width="320" height="48" rx="7" fill="#f7f8fb" stroke="#e6e9f0"/>
  <circle cx="814" cy="513" r="8" fill="#f0a05a"/>
  <text x="814" y="517" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">1</text>
  <text x="830" y="513" fill="#22262f" font-size="11" font-family="ui-monospace,Menlo,monospace">.g-recharge</text>
  <text x="830" y="530" fill="#6f7789" font-size="10.5">批注：汇率字号太小，改成 20px</text>

  <rect x="798" y="552" width="320" height="48" rx="7" fill="#f7f8fb" stroke="#e6e9f0"/>
  <circle cx="814" cy="567" r="8" fill="#7f8c9b"/>
  <text x="814" y="571" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">2</text>
  <text x="830" y="567" fill="#22262f" font-size="11" font-family="ui-monospace,Menlo,monospace">.code-row</text>
  <text x="830" y="584" fill="#8b93a7" font-size="10.5" font-style="italic">标注（未写说明）</text>

  <!-- caption -->
  <text x="600" y="672" fill="#5a6274" font-size="12" text-anchor="middle">点「标记」→ 悬停高亮 → 点选 → 写或不写 → 加入对话</text>
</svg>